<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Shift Kerja SPPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F3A; --navy2:#12305A; --navy3:#1B427A; --gold:#D4AF37; --gold2:#F1D77A; --goldsoft:#FBF3D5;
  --bg:#F4F6FA; --card:#fff; --ink:#0B1F3A; --muted:#6B7A90; --line:#E3E8F0;
  --ok:#1E8E5A; --okbg:#E4F5EC; --bad:#C0392B; --badbg:#FCE8E6; --off:#EEF1F6;
  --help:#2563A8; --helpbg:#E3EEFA; --r:14px; --sh:0 2px 10px rgba(11,31,58,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}

/* top bar */
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.top-in{max-width:1180px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:var(--navy);font-weight:800;font-size:16px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand small{color:var(--gold2);font-size:11.5px;opacity:.9}
.sp{flex:1}
.btn{padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-line{border:1px solid var(--line);background:#fff}
.btn-line:hover{border-color:var(--gold)}
.btn-red{background:var(--badbg);color:var(--bad)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}

/* nav */
.nav{max-width:1180px;margin:auto;padding:0 12px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 15px;border-radius:999px;color:#C8D3E6;font-weight:600;font-size:13px;white-space:nowrap}
.nav button.on{background:var(--gold);color:var(--navy)}
.nav button:not(.on):hover{background:rgba(255,255,255,.1)}

main{max-width:1180px;margin:auto;padding:16px 14px 70px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid var(--line)}
h2{font-size:19px;font-weight:800}
h3{font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.datebar .dn{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:18px;font-weight:700;color:var(--navy)}
.datebar .dn:hover{border-color:var(--gold);background:var(--goldsoft)}
.datebar input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600}
.daybig{font-weight:800;font-size:17px;margin-right:auto}
.daybig small{display:block;font-weight:500;color:var(--muted);font-size:12px}

/* division card */
.dcard{border-top:4px solid var(--gold);padding:14px}
.dcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.jam{font-size:12px;color:var(--navy3);font-weight:600;background:var(--goldsoft);padding:2px 9px;border-radius:999px;display:inline-block;margin-top:3px}
.cnt{min-width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--goldsoft);border:1px solid #EBDDA0;color:var(--navy)}
.chip.help{background:var(--helpbg);border-color:#BBD5F0;color:var(--help)}
.chip.go{background:#fff;border:1px dashed #9db3d1;color:var(--muted)}
.chip.me{outline:2px solid var(--gold);background:var(--gold)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.tugas{font-size:12px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}

/* badges */
.badge{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-block}
.b-OK{background:var(--okbg);color:var(--ok)}
.b-KURANG{background:var(--badbg);color:var(--bad)}
.b-LIBUR{background:var(--off);color:var(--muted)}

/* stats */
.stat{padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:rgba(212,175,55,.2)}
.stat small{color:var(--gold2);font-weight:600;font-size:12px}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--gold)}
.stat.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
.stat.alt b{color:var(--navy)} .stat.alt small{color:var(--muted)}

/* tables */
.tw{overflow:auto;border-radius:12px;border:1px solid var(--line);background:#fff;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;font-weight:700;padding:9px 8px;position:sticky;top:0;z-index:2;white-space:nowrap}
th small{display:block;color:var(--gold2);font-weight:500;font-size:10.5px}
th.we{background:#8a2c2c}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
td.nm,th.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:150px;font-weight:600}
th.nm{background:var(--navy);z-index:3}
tr:hover td{background:#FFFCF0} tr:hover td.nm{background:#FFFCF0}
tr.grp td{background:var(--goldsoft);text-align:left;font-weight:800;color:var(--navy3);position:sticky;left:0}
.c1{background:var(--gold);color:var(--navy);border-radius:7px;padding:3px 0;display:block;min-width:32px;font-weight:700;font-size:11px}
.c2{background:var(--helpbg);color:var(--help);border-radius:7px;padding:3px 0;display:block;font-weight:700;font-size:11px}
.c3{background:#fff;border:1px solid var(--help);color:var(--help);border-radius:7px;padding:2px 0;display:block;font-weight:700;font-size:11px}
.c0{color:#B7C1D1;font-size:11px}
td.ed{cursor:pointer}td.ed:hover{background:var(--goldsoft)}td.ovr{position:relative}td.ovr:after{content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 2px var(--gold)}
td.today,th.today{box-shadow:inset 0 -3px 0 var(--gold)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}

/* chips selector */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;white-space:nowrap}
.pill.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}

/* forms */
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.inp:focus{outline:2px solid var(--gold2);border-color:var(--gold)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-weight:600;font-size:12px}
.days input:checked+span{color:var(--navy);font-weight:800}
.days label:has(input:checked){background:var(--goldsoft);border-color:var(--gold)}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:50;display:grid;place-items:center;padding:14px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px;border-top:5px solid var(--gold)}
.modal h3{margin-bottom:6px;font-size:17px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;z-index:90;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3);border-left:4px solid var(--gold)}
.toast.err{border-left-color:#ff6b5b}
.bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--gold);z-index:99;transition:width .4s}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,#e8ecf3 25%,#f3f5f9 50%,#e8ecf3 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.login{max-width:360px;margin:8vh auto;text-align:center}
.login .logo{margin:0 auto 12px;width:56px;height:56px;font-size:24px;border-radius:16px}
.login input{text-align:center;font-size:22px;letter-spacing:8px;margin:14px 0}
.srch{position:relative;max-width:340px;flex:1}
.srch input{padding-left:34px}
.srch:before{content:"🔍";position:absolute;left:11px;top:9px;font-size:13px;opacity:.6}
@media(max-width:600px){.brand small{display:none}.daybig{width:100%}}
@media print{.top,.datebar,.pills,.noprint,.btn{display:none!important}body{background:#fff}main{padding:0}.tw{max-height:none;border:0}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>

<header class="top">
  <div class="top-in">
    <div class="logo">S</div>
    <div class="brand"><b id="brandName">Jadwal Shift Kerja</b><small id="brandSub">Halaman Relawan</small></div>
    <div class="sp"></div>
    <button class="btn btn-gold" id="btnAdmin" onclick="openLogin()">🔐 Masuk Admin</button>
    <button class="btn btn-ghost hide" id="btnOut" onclick="logout()">Keluar</button>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<main id="main"><div class="grid g-cards"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
<div id="layer"></div>

<script>
/* ===================== STATE & HELPERS ===================== */
var S={mode:'relawan',page:'hariini',token:null,cur:null,data:null,admin:null,cache:{},divSel:'',q:'',kq:'',kd:''};
var DAYS=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],DL=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pd(iso){var p=iso.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]))}
function fi(d){return d.toISOString().slice(0,10)}
function add(iso,n){var d=pd(iso);d.setUTCDate(d.getUTCDate()+n);return fi(d)}
function wd(iso){return (pd(iso).getUTCDay()+6)%7}
function fs(iso){var d=pd(iso);return d.getUTCDate()+' '+MON[d.getUTCMonth()]}
function fl(iso){return DL[wd(iso)]+', '+fs(iso)+' '+pd(iso).getUTCFullYear()}
function bar(p){var b=$('bar');b.style.opacity=1;b.style.width=p+'%';if(p>=100)setTimeout(function(){b.style.opacity=0;b.style.width=0},350)}
function toast(m,err){var t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function gs(fn){
  var a=[].slice.call(arguments,1);bar(40);
  return new Promise(function(ok,no){
    var r=google.script.run.withSuccessHandler(function(x){bar(100);ok(x)}).withFailureHandler(function(e){
      bar(100);var m=String(e&&e.message||e);
      if(m.indexOf('SESSION_EXPIRED')>=0){toast('Sesi berakhir, masuk lagi',1);forceLogout()}else toast(m.replace(/^(Exception|Error):\s*/,''),1);
      no(e)});
    r[fn].apply(r,a);
  });
}
function skel(){$('main').innerHTML='<div class="grid g-cards"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>'}

/* ===================== NAV ===================== */
var NAV_REL=[['hariini','📅 Jadwal Hari Ini'],['jadwal14','🗓️ Jadwal 14 Hari']];
var NAV_ADM=[['dash','📊 Dashboard'],['jadwal','🗓️ Jadwal'],['rekap','📈 Rekap'],['karyawan','👥 Karyawan'],['divisi','🏷️ Divisi'],['set','⚙️ Pengaturan'],['hariini','👁️ Tampilan Relawan']];
function renderNav(){
  var L=S.mode==='admin'?NAV_ADM:NAV_REL;
  $('nav').innerHTML=L.map(function(x){return '<button class="'+(S.page===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
  $('btnAdmin').classList.toggle('hide',S.mode==='admin');
  $('btnOut').classList.toggle('hide',S.mode!=='admin');
  $('brandSub').textContent=S.mode==='admin'?'Panel Admin':'Halaman Relawan';
}
function go(p){S.page=p;S.q='';renderNav();draw()}

/* ===================== DATA LOADING ===================== */
function load(force){
  var key=S.cur;
  if(S.mode==='admin'){
    return gs('adminLoad',S.token,S.cur).then(function(a){S.admin=a;S.data=a.schedule;$('brandName').textContent=a.settings.instansi||'Jadwal Shift Kerja'});
  }
  if(!force&&S.cache[key]){S.data=S.cache[key];return Promise.resolve()}
  return gs('apiRelawan',S.cur).then(function(d){S.cache[key]=d;S.data=d;$('brandName').textContent=d.instansi});
}
function setDate(iso){S.cur=iso;skel();load().then(draw)}
function step(n){setDate(add(S.cur,n))}

/* ===================== DRAW ROUTER ===================== */
function draw(){
  if(!S.data)return;
  var p=S.page;
  if(p==='hariini')return viewHariIni();
  if(p==='jadwal14'||p==='jadwal')return viewGrid();
  if(p==='dash')return viewDash();
  if(p==='rekap')return viewRekap();
  if(p==='karyawan')return viewKaryawan();
  if(p==='divisi')return viewDivisi();
  if(p==='set')return viewSet();
}
function datebar(stepDays,extra){
  var d=S.data.dates[0];
  return '<div class="datebar"><div class="daybig">'+fl(d)+'<small>'+(d===S.data.today?'Hari ini':'Tanggal dipilih')+'</small></div>'+
  '<button class="dn" onclick="step(-'+stepDays+')">‹</button>'+
  '<input type="date" value="'+d+'" onchange="this.value&&setDate(this.value)">'+
  '<button class="dn" onclick="step('+stepDays+')">›</button>'+
  '<button class="btn btn-line btn-sm" onclick="setDate(S.data.today)">Hari ini</button>'+(extra||'')+'</div>';
}
function totals(){return S.admin.antar}
function tgt(){var s=S.admin.settings,hr=(s.targetHari||'').split(',');return{n:s.target,days:hr}}
function onTarget(i){var T=tgt();return T.n>0&&T.days.indexOf(DAYS[wd(S.data.dates[i])])>=0}
function effective(d,i){return d.masuk[i]-d.keluar[i]+d.masukBantu[i]}

/* ===================== VIEW: HARI INI (relawan & admin) ===================== */
function viewHariIni(){
  var q=S.q.toLowerCase();
  var h=datebar(1)+'<div class="row noprint" style="margin-bottom:12px"><div class="srch"><input class="inp" placeholder="Cari nama saya…" value="'+esc(S.q)+'" oninput="S.q=this.value;viewHariIni(true)"></div></div><div class="grid g-cards">';
  S.data.divisi.forEach(function(d){
    var names=[],help=[],go=[];
    d.orang.forEach(function(p){
      if(p.kode[0]===1)names.push(p.nama);
      if(p.kode[0]===2)go.push([p.nama,p.ke]);
    });
    help=d.bantuan[0]||[];
    var n=names.length+help.length,libur=!d.kerja[0];
    function chip(nm,cls){var me=q&&nm.toLowerCase().indexOf(q)>=0;return '<span class="chip '+cls+(me?' me':'')+'">'+esc(nm)+'</span>'}
    h+='<div class="card dcard"><div class="hd"><div><h3>'+esc(d.nama.replace('Relawan ',''))+'</h3><span class="jam">⏰ '+esc(d.jam)+'</span></div>'+
      (libur?'<span class="badge b-LIBUR">Libur</span>':'<div class="cnt">'+(names.length+help.length)+'</div>')+'</div>';
    if(libur)h+='<div class="empty">Tim ini libur hari ini.</div>';
    else{
      h+='<div class="chips">'+names.map(function(x){return chip(x,'')}).join('')+help.map(function(x){return chip(x,'help').replace('</span>',' · bantuan</span>')}).join('')+go.map(function(g){return '<span class="chip go">'+esc(g[0])+' → '+esc(g[1].replace('Relawan ',''))+'</span>'}).join('')+'</div>';
      if(!n&&!go.length)h+='<div class="empty">Belum ada yang bertugas.</div>';
    }
    if(d.tugas)h+='<div class="tugas"><b>Tugas:</b> '+esc(d.tugas)+(d.istirahat?'<br><b>Istirahat:</b> '+esc(d.istirahat):'')+'</div>';
    h+='</div>';
  });
  $('main').innerHTML=h+'</div>';
  if(arguments[0]){var i=document.querySelector('.srch input');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}

/* ===================== VIEW: GRID 14 HARI ===================== */
function legend(){return '<div class="legend"><span><i style="background:var(--gold)"></i>Masuk</span><span><i style="background:var(--helpbg)"></i>Bantu tim lain</span><span><i style="background:#fff;border:1px solid var(--help)"></i>Dibantu</span><span><span class="c0">OFF</span> Libur</span></div>'}
function viewGrid(){
  var D=S.data,isA=S.mode==='admin';
  var list=D.divisi;
  if(!S.divSel||!list.some(function(d){return d.nama===S.divSel}))S.divSel=isA?'*':list[0].nama;
  var sel=S.divSel,q=S.q.toLowerCase();
  var pills=(isA?'<button class="pill '+(sel==='*'?'on':'')+'" onclick="S.divSel=\'*\';viewGrid()">Semua</button>':'')+
    list.map(function(d){return '<button class="pill '+(sel===d.nama?'on':'')+'" onclick="S.divSel=\''+esc(d.nama)+'\';viewGrid()">'+esc(isA?d.nama:d.nama.replace('Relawan ',''))+'</button>'}).join('');
  var tb='<button class="btn btn-line btn-sm" onclick="window.print()">🖨️ Cetak</button>'+(isA&&S.page==='jadwal'?'<button class="btn btn-gold btn-sm" onclick="autoGen()">🎲 Auto Generate</button><button class="btn btn-line btn-sm" onclick="resetManual()">↺ Reset manual</button><button class="btn btn-red btn-sm" onclick="clearAll()">🗑️ Kosongkan semua</button>':'');
  var h=datebar(7,tb)+(isA&&S.page==='jadwal'?'<p class="sub noprint" style="margin-bottom:10px">Klik kotak nama & tanggal untuk mengatur masuk/OFF secara manual. Titik ● = diatur manual. Auto Generate mengacak giliran rotasi relawan. Kosongkan semua = semua OFF, lalu isi sendiri.</p>':'')+'<div class="pills noprint">'+pills+'</div>'+
    '<div class="row noprint" style="margin:10px 0"><div class="srch"><input class="inp" placeholder="Cari nama…" value="'+esc(S.q)+'" oninput="S.q=this.value;viewGrid(true)"></div></div>'+legend();
  var head='<tr><th class="nm">Nama</th>'+D.dates.map(function(dt,i){var w=wd(dt);return '<th class="'+(w>4?'we ':'')+(dt===D.today?'today':'')+'">'+DAYS[w]+'<small>'+fs(dt)+'</small></th>'}).join('')+'<th>Hari</th></tr>';
  var body='';
  list.forEach(function(d){
    if(sel!=='*'&&d.nama!==sel)return;
    var rows=d.orang.filter(function(p){return !q||p.nama.toLowerCase().indexOf(q)>=0});
    if(sel==='*'&&!rows.length)return;
    if(sel==='*')body+='<tr class="grp"><td colspan="'+(D.dates.length+2)+'">'+esc(d.nama)+' <span class="sub">· '+esc(d.jam)+'</span></td></tr>';
    rows.forEach(function(p){
      var n=0;
      body+='<tr><td class="nm">'+esc(p.nama)+'</td>'+p.kode.map(function(k,i){

    D.divisi.map(function(d){var ex=d.keluar[0]||d.masukBantu[0]?' <span class="sub">('+(d.keluar[0]?'−'+d.keluar[0]:'')+(d.masukBantu[0]?'+'+d.masukBantu[0]:'')+')</span>':'';

}
function saveSet(){
  gs('adminSaveSettings',S.token,{instansi:$('si').value,geser:+$('sg').value||0,target:+$('st').value||0,targetHari:[].slice.call(document.querySelectorAll('.days input:checked')).map(function(c){return c.value}).join(','),pin:$('sp').value},S.cur).then(function(a){applyAdmin(a);$('brandName').textContent=a.settings.instansi;toast('Tersimpan ✓')});
}

/* ===================== LOGIN ===================== */
function modal(html){$('layer').innerHTML='<div class="ov" onmousedown="if(event.target===this)closeM()"><div class="modal">'+html+'</div></div>'}
function closeM(){$('layer').innerHTML=''}
function openLogin(){
  modal('<div class="login" style="margin:0 auto"><div class="logo">🔐</div><h3>Masuk Admin</h3><p class="sub">Masukkan PIN admin</p><input id="pin" type="password" inputmode="numeric" maxlength="12" class="inp" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"><button class="btn btn-gold" style="width:100%;justify-content:center" onclick="doLogin()">Masuk</button><button class="btn" style="margin-top:10px;color:var(--navy3);font-size:12.5px;text-decoration:underline" onclick="openChangePin()">Ganti PIN / password</button></div>');
  setTimeout(function(){$('pin').focus()},50);
}
function openChangePin(){
  modal('<div class="login" style="margin:0 auto"><div class="logo">🔑</div><h3>Ganti Password Admin</h3><p class="sub">PIN 4–12 digit angka</p>'+
   '<label class="f" style="text-align:left">PIN lama</label><input id="op" type="password" inputmode="numeric" maxlength="12" class="inp" autocomplete="current-password" style="margin:0 0 4px;font-size:18px;letter-spacing:5px">'+
   '<label class="f" style="text-align:left">PIN baru</label><input id="np" type="password" inputmode="numeric" maxlength="12" class="inp" autocomplete="new-password" style="margin:0 0 4px;font-size:18px;letter-spacing:5px">'+
   '<label class="f" style="text-align:left">Ulangi PIN baru</label><input id="np2" type="password" inputmode="numeric" maxlength="12" class="inp" autocomplete="new-password" style="margin:0 0 14px;font-size:18px;letter-spacing:5px" onkeydown="if(event.key===\'Enter\')doChangePin()">'+
   '<button class="btn btn-gold" style="width:100%;justify-content:center" onclick="doChangePin()">Simpan PIN baru</button>'+
   '<button class="btn" style="margin-top:10px;color:var(--muted);font-size:12.5px" onclick="openLogin()">← Kembali</button></div>');
  setTimeout(function(){$('op').focus()},50);
}
function doChangePin(){
  var o=$('op').value,n=$('np').value,n2=$('np2').value;
  if(!o||!n)return toast('Lengkapi semua isian',1);
  if(!/^\d{4,12}$/.test(n))return toast('PIN baru harus 4-12 digit angka',1);
  if(n!==n2)return toast('Ulangi PIN baru tidak sama',1);
  gs('apiChangePin',o,n).then(function(r){
    if(!r.ok)return toast(r.msg,1);
    toast('PIN berhasil diganti. Silakan masuk dengan PIN baru.');openLogin();
  });
}
function doLogin(){
  var p=$('pin').value;if(!p)return;
  gs('apiLogin',p).then(function(r){
    if(!r.ok)return toast(r.msg,1);
    S.token=r.token;S.mode='admin';S.page='dash';try{sessionStorage.setItem('tk',r.token)}catch(e){}
    closeM();renderNav();skel();load().then(draw);
  });
}
function logout(){if(S.token)gs('apiLogout',S.token);forceLogout(true)}
function forceLogout(silent){
  try{sessionStorage.removeItem('tk')}catch(e){}
  S.token=null;S.mode='relawan';S.page='hariini';S.admin=null;S.cache={};renderNav();skel();load().then(draw);
}

/* ===================== INIT ===================== */
(function(){
  var t=null;try{t=sessionStorage.getItem('tk')}catch(e){}
  S.cur=new Date(Date.now()+7*3600000).toISOString().slice(0,10); // WIB
  if(t){S.token=t;S.mode='admin';S.page='dash'}
  renderNav();
  load().then(draw,function(){if(t)forceLogout(true)});
})();
</script>
</body>
</html>
